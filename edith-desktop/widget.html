<!doctype html>
<html lang="en" data-state="collapsed">
  <head>
    <meta charset="utf-8" />
    <!-- All networking goes through the main process over IPC (see widget-preload.js
         and main.js), so the renderer itself never makes a network request:
         connect-src 'none'. Audio replies arrive as base64 -> blob: URLs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'none';"
    />
    <title>Edith</title>
    <style>
      /* ---- Liquid Glass, mapped to the web per the liquid-glass skill ----
         Apple's native .glassEffect() has no web equivalent, so (exactly as
         the skill's own web reviewers did) it maps to backdrop-filter
         blur+saturate. Design rules honoured:
           - Glass lives ONLY on the floating navigation layer (the whole
             island IS the navigation layer here). Elements sitting ON the
             glass (mic, bubbles, input) use fills/vibrancy, never a 2nd glass.
           - One variant (Regular). Tint reserved for the ONE primary action
             (the mic control).
           - Concentric radii: inner controls' radius = panel radius - padding.
           - Reduced-transparency + reduced-motion accessibility fallbacks. */

      :root {
        --accent: #6ea8fe;        /* primary-action tint (the mic) */
        --accent-strong: #3b82f6;
        --rim: rgba(255, 255, 255, 0.35);
        --panel-radius: 26px;
        --pad: 14px;
        --text: #f4f6fb;
        --text-dim: rgba(244, 246, 251, 0.6);
        /* backdrop-filter can't blur the desktop behind a transparent Electron
           window (it only samples same-page content), so the panel can't rely
           on blur for legibility — it needs a genuinely opaque dark surface or
           you read straight through it. Kept just translucent enough to still
           feel like glass. */
        --glass-bg: rgba(18, 20, 26, 0.94);
        --glass-bg-solid: rgba(18, 20, 26, 0.98); /* reduced-transparency fallback */
        --bubble-user: rgba(110, 168, 254, 0.22);
        --bubble-edith: rgba(255, 255, 255, 0.08);
        --field: rgba(255, 255, 255, 0.08);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --text: #0f1115;
          --text-dim: rgba(15, 17, 21, 0.55);
          --glass-bg: rgba(248, 249, 252, 0.95);
          --glass-bg-solid: rgba(246, 247, 250, 0.98);
          --rim: rgba(255, 255, 255, 0.7);
          --bubble-user: rgba(59, 130, 246, 0.18);
          --bubble-edith: rgba(15, 17, 21, 0.06);
          --field: rgba(15, 17, 21, 0.05);
        }
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        /* The Electron window is transparent; only the glass shape paints. */
        background: transparent;
        overflow: hidden;
        color: var(--text);
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      /* ============================ COLLAPSED PILL ============================ */
      /* Resting state hugs the notch: a dark capsule that reads as an extension
         of the physical notch / a Dynamic Island. */
      #pill {
        position: fixed;
        top: 6px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 4px;
        height: 40px;
        padding: 0 6px 0 13px;
        border-radius: 999px; /* capsule */
        background: rgba(10, 11, 14, 0.82);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        backdrop-filter: blur(24px) saturate(160%);
        border: 0.5px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: #f4f6fb;
        transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.25, 1), box-shadow 0.22s;
      }
      html[data-state="collapsed"] #pill { display: flex; }
      #pill:hover { transform: translateX(-50%) scale(1.03); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55); }

      /* Left region: tap to open the conversation panel. */
      #pill-open {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 100%;
        padding: 0;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: transform 0.12s;
      }
      #pill-open .label { font-size: 13px; font-weight: 600; letter-spacing: 0.2px; }
      #pill-open:active { transform: scale(0.96); }

      /* Right region: THE voice control. The one tinted, interactive element —
         tap it to talk to Edith without opening the panel first. */
      #pill-mic {
        width: 30px;
        height: 30px;
        flex: none;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        color: #fff;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, var(--accent), var(--accent-strong));
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        -webkit-app-region: no-drag;
        transition: transform 0.12s cubic-bezier(0.2, 0.9, 0.25, 1), box-shadow 0.18s;
      }
      #pill-mic:hover { transform: scale(1.12); }
      #pill-mic:active { transform: scale(0.9); }
      #pill-mic.recording {
        background: linear-gradient(160deg, #ff6b6b, #e03131);
        animation: pulse-rec 1.1s infinite;
      }

      /* Animated presence orb — reused in the panel header. */
      .orb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #cfe0ff, var(--accent) 55%, var(--accent-strong));
        box-shadow: 0 0 10px rgba(110, 168, 254, 0.8);
        flex: none;
        animation: breathe 3.2s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.18); opacity: 1; }
      }

      /* ============================ EXPANDED PANEL ============================ */
      #panel {
        position: fixed;
        inset: 8px;
        display: none;
        flex-direction: column;
        border-radius: var(--panel-radius);
        background: var(--glass-bg);
        -webkit-backdrop-filter: blur(34px) saturate(180%);
        backdrop-filter: blur(34px) saturate(180%);
        border: 0.5px solid var(--rim);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.25); /* top rim highlight = "lensing" */
        overflow: hidden;
      }
      html[data-state="expanded"] #panel { display: flex; animation: rise 0.28s cubic-bezier(0.2, 0.9, 0.25, 1); }
      @keyframes rise {
        from { opacity: 0; transform: translateY(-10px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }

      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px var(--pad);
        -webkit-app-region: drag; /* header is the drag handle */
      }
      .head .title { font-size: 14px; font-weight: 600; }
      .head .spacer { flex: 1; }
      .icon-btn {
        -webkit-app-region: no-drag;
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 8px;
        background: var(--field);
        color: var(--text);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 0.15s, transform 0.1s;
      }
      .icon-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .icon-btn:active { transform: scale(0.9); }

      #transcript {
        flex: 1;
        overflow-y: auto;
        padding: 4px var(--pad) 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        -webkit-user-select: text;
        user-select: text;
      }
      #transcript::-webkit-scrollbar { width: 6px; }
      #transcript::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.35); border-radius: 3px; }

      .bubble {
        max-width: 84%;
        padding: 9px 13px;
        border-radius: 16px; /* concentric-ish: panel 26 - pad 14 ≈ 12–16 */
        font-size: 13.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .bubble.user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 6px; }
      .bubble.edith { align-self: flex-start; background: var(--bubble-edith); border-bottom-left-radius: 6px; }
      .bubble.system { align-self: center; background: transparent; color: var(--text-dim); font-size: 12px; text-align: center; }

      /* Live status ("Listening…", "Searching the web") */
      #status {
        min-height: 16px;
        padding: 0 var(--pad) 6px;
        font-size: 12px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #status .dots { display: none; }
      #status.busy .dots { display: inline-flex; gap: 3px; }
      #status .dots i {
        width: 5px; height: 5px; border-radius: 50%;
        background: var(--accent); display: inline-block;
        animation: blink 1.2s infinite ease-in-out;
      }
      #status .dots i:nth-child(2) { animation-delay: 0.18s; }
      #status .dots i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

      /* -------- Composer (the ONE tinted control lives here) -------- */
      .composer {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom, 0));
      }
      #text {
        flex: 1;
        -webkit-app-region: no-drag;
        height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 0.5px solid var(--rim);
        background: var(--field);
        color: var(--text);
        font-size: 13.5px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #text::placeholder { color: var(--text-dim); }

      /* THE primary action — the only tinted, interactive-glass element. */
      #mic {
        -webkit-app-region: no-drag;
        width: 46px;
        height: 46px;
        flex: none;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        font-size: 19px;
        color: #fff;
        background: linear-gradient(160deg, var(--accent), var(--accent-strong));
        box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        transition: transform 0.12s cubic-bezier(0.2, 0.9, 0.25, 1), box-shadow 0.18s;
        display: grid;
        place-items: center;
      }
      #mic:hover { transform: scale(1.08); }
      #mic:active { transform: scale(0.92); }
      #mic.recording {
        background: linear-gradient(160deg, #ff6b6b, #e03131);
        box-shadow: 0 0 0 0 rgba(224, 49, 49, 0.55);
        animation: pulse-rec 1.1s infinite;
      }
      @keyframes pulse-rec {
        0% { box-shadow: 0 0 0 0 rgba(224, 49, 49, 0.55); }
        70% { box-shadow: 0 0 0 14px rgba(224, 49, 49, 0); }
        100% { box-shadow: 0 0 0 0 rgba(224, 49, 49, 0); }
      }
      #send {
        -webkit-app-region: no-drag;
        width: 40px; height: 40px; flex: none;
        border: none; border-radius: 50%;
        background: var(--field); color: var(--text);
        font-size: 17px; cursor: pointer;
        transition: transform 0.1s, background 0.15s;
      }
      #send:hover { background: rgba(255, 255, 255, 0.16); }
      #send:active { transform: scale(0.9); }

      /* -------- First-run token entry (only if no saved token) -------- */
      #token-gate {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: stretch;
        gap: 10px;
        padding: 24px;
        text-align: center;
      }
      html[data-gate="1"] #token-gate { display: flex; }
      html[data-gate="1"] #transcript, html[data-gate="1"] .composer, html[data-gate="1"] #status { display: none; }
      #token-gate p { margin: 0; font-size: 13px; color: var(--text-dim); }
      #token-input {
        height: 40px; padding: 0 14px; border-radius: 12px;
        border: 0.5px solid var(--rim); background: var(--field);
        color: var(--text); font-size: 13.5px; outline: none;
        -webkit-user-select: text; user-select: text; -webkit-app-region: no-drag;
      }
      #token-save {
        height: 40px; border: none; border-radius: 12px; cursor: pointer;
        background: linear-gradient(160deg, var(--accent), var(--accent-strong));
        color: #fff; font-weight: 600; font-size: 14px; -webkit-app-region: no-drag;
      }
      #token-err { color: #ff8a8a; font-size: 12px; min-height: 14px; }

      /* -------- Accessibility fallbacks (free at system level natively;
                  here we honour the same OS toggles). -------- */
      @media (prefers-reduced-transparency: reduce) {
        #panel { background: var(--glass-bg-solid); -webkit-backdrop-filter: none; backdrop-filter: none; }
        #pill { background: rgba(12, 13, 16, 0.98); -webkit-backdrop-filter: none; backdrop-filter: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- Collapsed: the notch pill. Left = open the panel; right = the voice
         control (tap to speak to Edith straight from the island). -->
    <div id="pill">
      <button id="pill-open" title="Open Edith">
        <span class="orb"></span>
        <span class="label">Edith</span>
      </button>
      <button id="pill-mic" title="Tap to speak to Edith">🎙️</button>
    </div>

    <!-- Expanded: the glass conversation panel -->
    <section id="panel">
      <header class="head">
        <span class="orb"></span>
        <span class="title">Edith</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="dashboard-btn" title="Open full app">⤢</button>
        <button class="icon-btn" id="collapse-btn" title="Minimize to notch">▁</button>
      </header>

      <div id="transcript"></div>

      <div id="status"><span class="dots"><i></i><i></i><i></i></span><span class="status-text"></span></div>

      <div class="composer">
        <button id="mic" title="Tap to talk">🎙️</button>
        <input id="text" placeholder="Message Edith…" autocomplete="off" spellcheck="false" />
        <button id="send" title="Send">↑</button>
      </div>

    </section>

    <script src="widget.js"></script>
  </body>
</html>
