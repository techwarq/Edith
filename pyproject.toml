[project]
name = "edith"
version = "0.1.0"
description = "Personal AI agent — memory + chat core"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "playwright>=1.40.0",
    "browserbase>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "qdrant-client>=1.18.0",
    "temporalio>=1.30.0",
    "firebase-admin>=6.5.0",
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "pypdf>=4.0.0",
    # Computer use (edith/computer_use/) — macOS-only Accessibility/screen-capture/OCR
    # bindings. Markers keep these off the hosted Railway (Linux) install; the tool itself
    # reports "not available" there rather than needing them.
    "pyobjc-framework-ApplicationServices>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=12.2.2; sys_platform == 'darwin'",
    # Streaming voice command loop (edith/computer_use/speech_stream.py) — on-device
    # continuous speech recognition (Speech) fed by a live mic tap (AVFoundation).
    "pyobjc-framework-Speech>=12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
edith = "edith.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "edith",
    "edith.computer_use",
    "edith.goals",
    "edith.google",
    "edith.integrations",
    "edith.job_applications",
    "edith.linkedin",
    "edith.llm",
    "edith.mcp",
    "edith.memory",
    "edith.monitor",
    "edith.observability",
    "edith.temporal",
    "edith.todos",
    "edith.tools",
    "edith.web",
]
