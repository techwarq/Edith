<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Edith</title>
<style>
  :root {
    --bg: #e9ede3;
    --surface: #ffffff;
    --surface-2: #dfe4d7;
    --border: #d5dbcb;
    --text: #14150f;
    --muted: #767c6d;
    --accent: #14150f;
    --accent-contrast: #f3f5ee;
    --danger: #c0392b;
    --good: #0ca30c;
    --dark-card-bg: #14150f;
    --dark-card-text: #f3f5ee;
    --dark-card-muted: #9a9d92;
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-pill: 999px;
    --shadow: 0 1px 2px rgba(20, 20, 10, 0.05), 0 6px 20px rgba(20, 20, 10, 0.06);
  }
  :root[data-theme="dark"] {
    --bg: #0e0f0c;
    --surface: #1a1b16;
    --surface-2: #23241d;
    --border: #2e2f27;
    --text: #f0f1ea;
    --muted: #93968b;
    --accent: #f0f1ea;
    --accent-contrast: #14150f;
    --danger: #e88;
    --good: #2ecc71;
    --dark-card-bg: #f0f1ea;
    --dark-card-text: #14150f;
    --dark-card-muted: #6b6f66;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0f0c;
      --surface: #1a1b16;
      --surface-2: #23241d;
      --border: #2e2f27;
      --text: #f0f1ea;
      --muted: #93968b;
      --accent: #f0f1ea;
      --accent-contrast: #14150f;
      --danger: #e88;
      --good: #2ecc71;
      --dark-card-bg: #f0f1ea;
      --dark-card-text: #14150f;
      --dark-card-muted: #6b6f66;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    transition: background 0.15s ease, color 0.15s ease;
  }
  button { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; font-family: inherit; }
  input { -webkit-user-select: text; user-select: text; font-family: inherit; }

  #token-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; height: 100dvh; gap: 12px; padding: 20px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
  }
  #token-screen h2 { margin-bottom: 8px; font-size: 22px; letter-spacing: -0.01em; }
  #token-screen input {
    padding: 12px 16px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); width: 100%; max-width: 320px; font-size: 16px;
  }
  #token-screen button {
    padding: 12px 24px; min-height: 44px; border-radius: var(--radius-pill); border: none;
    background: var(--accent); color: var(--accent-contrast); font-weight: 600; cursor: pointer; font-size: 15px;
  }
  #token-error { color: var(--danger); font-size: 13px; min-height: 16px; }

  /* --- Top nav / workspace shell --- */
  #app-shell { display: none; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }
  #tab-bar {
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
    padding: 14px 20px; padding-top: max(14px, env(safe-area-inset-top));
  }
  #brand { display: flex; align-items: center; gap: 8px; margin-right: 18px; white-space: nowrap; }
  #brand-mark {
    width: 26px; height: 26px; border-radius: 8px; background: var(--dark-card-bg); color: var(--dark-card-text);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0;
  }
  #brand-word { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  #tab-buttons { display: flex; gap: 18px; flex: 1; overflow-x: auto; }
  .tab-btn {
    background: none; border: none; color: var(--muted); padding: 8px 2px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; min-height: 40px;
    white-space: nowrap; display: flex; align-items: center; gap: 6px;
  }
  .tab-btn.active { color: var(--text); }
  .tab-icon { font-size: 14px; }
  .tab-label { display: none; }
  #theme-toggle {
    background: var(--surface); border: none; border-radius: var(--radius-pill); box-shadow: var(--shadow);
    width: 38px; height: 38px; font-size: 15px; cursor: pointer; flex-shrink: 0; margin-left: 6px;
  }
  @media (min-width: 720px) {
    .tab-label { display: inline; }
  }

  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.active { display: flex; }

  .panel { padding: 8px 20px 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; min-height: 0; max-width: 1240px; width: 100%; margin: 0 auto; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 26px 0 12px; font-weight: 700; }
  .panel h3:first-child { margin-top: 0; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; }
  .panel-header h3 { margin: 26px 0 12px; }
  .panel-header:first-child h3 { margin-top: 0; }

  /* --- Chat --- */
  #chat-screen { flex-direction: column; }
  #status { text-align: center; padding: 6px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #messages {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    max-width: 780px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user, .msg.system, .msg.status { white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-contrast); }
  .msg.edith { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--border); }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 13px; }
  .msg.status { display: flex; align-items: center; gap: 8px; align-self: flex-start; background: transparent; color: var(--muted); font-size: 13px; padding: 4px 14px; }
  .status-label { white-space: nowrap; }
  .status-dots { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; width: 13px; height: 13px; flex-shrink: 0; }
  .status-dots span { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); animation: status-pulse 1.3s ease-in-out infinite; }
  .status-dots span:nth-child(1) { animation-delay: 0.0s; }
  .status-dots span:nth-child(2) { animation-delay: 0.1s; }
  .status-dots span:nth-child(3) { animation-delay: 0.2s; }
  .status-dots span:nth-child(4) { animation-delay: 0.1s; }
  .status-dots span:nth-child(5) { animation-delay: 0.2s; }
  .status-dots span:nth-child(6) { animation-delay: 0.3s; }
  .status-dots span:nth-child(7) { animation-delay: 0.2s; }
  .status-dots span:nth-child(8) { animation-delay: 0.3s; }
  .status-dots span:nth-child(9) { animation-delay: 0.4s; }
  @keyframes status-pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

  .msg.edith > *:first-child { margin-top: 0; }
  .msg.edith > *:last-child { margin-bottom: 0; }
  .msg.edith p { margin: 0 0 8px; }
  .msg.edith h1, .msg.edith h2, .msg.edith h3 { margin: 12px 0 6px; line-height: 1.3; }
  .msg.edith h1 { font-size: 1.15em; }
  .msg.edith h2 { font-size: 1.08em; }
  .msg.edith h3 { font-size: 1.02em; }
  .msg.edith ul, .msg.edith ol { margin: 0 0 8px; padding-left: 22px; }
  .msg.edith li { margin: 3px 0; }
  .msg.edith strong { font-weight: 700; }
  .msg.edith code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; background: rgba(127,127,127,0.16); padding: 1px 5px; border-radius: 4px; }
  .msg.edith pre { margin: 0 0 8px; padding: 10px 12px; background: var(--bg); border-radius: 8px; overflow-x: auto; }
  .msg.edith pre code { background: none; padding: 0; }
  .msg.edith a { color: var(--accent); text-decoration: underline; }

  #input-bar-wrap { position: relative; border-top: 1px solid var(--border); flex-shrink: 0; }
  #input-bar {
    display: flex; gap: 8px; padding: 12px; max-width: 780px; width: 100%; margin: 0 auto;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
  #input-bar input {
    flex: 1; min-width: 0; padding: 12px 16px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 16px;
  }
  #input-bar button { padding: 10px 20px; min-height: 44px; border-radius: var(--radius-pill); border: none; background: var(--accent); color: var(--accent-contrast); font-weight: 600; cursor: pointer; }
  #mic-btn { background: var(--surface-2); color: var(--text); min-width: 44px; border-radius: var(--radius-pill); font-size: 18px; }
  #mic-btn.recording { background: var(--danger); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  #command-menu {
    display: none; position: absolute; bottom: 100%; left: 12px; right: 12px;
    max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); margin-bottom: 6px; box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  }
  #command-menu.open { display: block; }
  .cmd-item { padding: 12px 14px; cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; min-height: 44px; }
  .cmd-item:hover, .cmd-item.active { background: var(--surface-2); }
  .cmd-item .cmd-name { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .cmd-item .cmd-desc { color: var(--muted); font-size: 13px; }

  /* --- Cards (goals/insights/stats/lists) --- */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-tile { flex: 1; min-width: 130px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 16px; }
  .stat-tile .stat-value { font-size: 21px; font-weight: 700; color: var(--text); }
  .stat-tile .stat-label { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stat-tile .stat-delta { font-size: 11px; font-weight: 600; margin-top: 5px; display: flex; align-items: center; gap: 3px; }
  .stat-tile .stat-delta.is-good { color: var(--good); }
  .stat-tile .stat-delta.is-bad { color: var(--danger); }
  .stat-tile .stat-delta.is-flat { color: var(--muted); }
  .stat-tile .stat-sparkline { display: block; margin-top: 8px; overflow: visible; }
  .stat-tile .stat-sparkline path { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .stat-tile .stat-sparkline circle { fill: var(--accent); }

  /* --- Eval score trend chart --- */
  .eval-trend-header { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 4px; }
  .eval-trend-header .eval-trend-score { font-size: 28px; font-weight: 700; color: var(--text); }
  .eval-chart-wrap { position: relative; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 16px 8px; margin-bottom: 4px; }
  .eval-chart-wrap svg { display: block; width: 100%; height: 140px; overflow: visible; }
  .eval-chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .eval-chart-grid { stroke: var(--border); stroke-width: 1; }
  .eval-chart-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; cursor: pointer; }
  .eval-chart-label { fill: var(--muted); font-size: 10px; }
  .eval-chart-tooltip {
    position: absolute; pointer-events: none; background: var(--dark-card-bg); color: var(--dark-card-text);
    font-size: 11px; padding: 6px 10px; border-radius: 8px; box-shadow: var(--shadow); white-space: nowrap;
    transform: translate(-50%, -100%); margin-top: -10px; display: none; z-index: 5;
  }

  .bar-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .bar-row .bar-label { width: 76px; flex-shrink: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-row .bar-value { width: 64px; text-align: right; flex-shrink: 0; color: var(--text); }

  .list-item { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 8px; cursor: pointer; }
  .list-item .list-title { font-weight: 600; font-size: 14px; }
  .list-item .list-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .list-item.is-error .list-meta { color: var(--danger); }
  .list-item .list-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .span-row { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .span-row:last-child { border-bottom: none; }

  .goal-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 10px; }
  .goal-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .goal-icon-badge {
    width: 34px; height: 34px; border-radius: var(--radius-pill); background: var(--surface-2);
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0;
  }
  .fraction-pill {
    background: var(--accent); color: var(--accent-contrast); font-size: 11px; font-weight: 700;
    border-radius: var(--radius-pill); padding: 3px 10px; white-space: nowrap;
  }
  .goal-card .goal-title { font-weight: 700; font-size: 15px; margin-top: 12px; }
  .goal-card .goal-meta { font-size: 12px; color: var(--muted); margin: 4px 0 10px; }
  .goal-date-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .milestone { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .milestone input[type=checkbox] { width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--accent); }
  .milestone.done label { text-decoration: line-through; color: var(--muted); }
  .goal-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .goal-actions button, .add-milestone-form button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 6px 14px; font-size: 12px; cursor: pointer; min-height: 30px;
  }
  .add-milestone-form { display: flex; gap: 6px; margin-top: 8px; }
  .add-milestone-form input {
    flex: 1; min-width: 0; padding: 7px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12px;
  }

  .todo-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 8px; }
  .todo-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .todo-title { font-weight: 600; font-size: 14px; }
  .todo-title.done { text-decoration: line-through; color: var(--muted); }
  .todo-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .todo-status-pill { font-size: 11px; font-weight: 700; border-radius: var(--radius-pill); padding: 3px 10px; white-space: nowrap; flex-shrink: 0; }
  .todo-status-pill.todo { background: var(--surface-2); color: var(--muted); }
  .todo-status-pill.in_progress { background: var(--accent); color: var(--accent-contrast); }
  .todo-status-pill.done { background: var(--surface-2); color: var(--muted); }
  .todo-note { font-size: 12px; color: var(--text); opacity: 0.85; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); white-space: pre-wrap; }
  .todo-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .new-goal-form { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .new-goal-form input {
    flex: 1; min-width: 150px; padding: 10px 14px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px;
  }
  .new-goal-form button { padding: 10px 20px; border-radius: var(--radius-pill); border: none; background: var(--accent); color: var(--accent-contrast); font-weight: 600; cursor: pointer; }

  .insight-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 10px; }
  .insight-card .insight-title { font-weight: 700; font-size: 14px; }
  .insight-card .insight-body { font-size: 13px; color: var(--text); margin-top: 6px; white-space: pre-wrap; opacity: 0.85; }
  .insight-card .insight-meta { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .insight-card .dismiss-btn {
    margin-top: 10px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 6px 14px; font-size: 12px; cursor: pointer;
  }

  .empty-state { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 10px; }
  .refresh-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 4px 0; font-weight: 600; }

  /* --- Overview tab --- */
  .activity-item { background: var(--dark-card-bg); color: var(--dark-card-text); border: none; box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; }
  .activity-item.is-error { box-shadow: inset 0 0 0 2px var(--danger); }
  .activity-item .activity-when { font-size: 11px; color: var(--dark-card-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .activity-item .activity-input { font-size: 14px; color: var(--dark-card-text); margin-top: 4px; font-weight: 700; }
  .activity-item .activity-output { font-size: 12px; color: var(--dark-card-muted); margin-top: 4px; }
  .tool-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .tool-chip { font-size: 10px; background: rgba(128,128,128,0.25); color: var(--dark-card-text); border-radius: var(--radius-pill); padding: 3px 9px; font-weight: 600; }

  .mini-goal { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 13px 16px; margin-bottom: 8px; }
  .mini-goal .mini-goal-title { font-weight: 700; font-size: 14px; }
  .mini-goal .mini-goal-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .progress-track { position: relative; height: 4px; background: var(--surface-2); border-radius: 3px; margin-top: 10px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .progress-puck {
    position: absolute; top: 50%; width: 12px; height: 12px; border-radius: var(--radius-pill);
    background: var(--accent); border: 2px solid var(--surface); transform: translate(-50%, -50%);
  }

  .see-all-link { display: block; text-align: center; color: var(--accent); font-size: 12px; padding: 8px; cursor: pointer; font-weight: 600; }

  /* --- MCP servers (Integrations tab) --- */
  .new-mcp-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .new-mcp-form-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .new-mcp-form input {
    flex: 1; min-width: 140px; padding: 10px 14px; border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px;
  }
  .new-mcp-form button { padding: 10px 20px; border-radius: var(--radius-pill); border: none; background: var(--accent); color: var(--accent-contrast); font-weight: 600; cursor: pointer; }
  .new-mcp-form .field-hint { font-size: 11px; color: var(--muted); margin: -4px 0 0 14px; }

  .mcp-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 8px; }
  .mcp-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mcp-name { font-weight: 700; font-size: 14px; }
  .mcp-command { font-size: 12px; color: var(--muted); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
  .mcp-toggle-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; flex-shrink: 0; }
  .mcp-toggle-label input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }
  .mcp-card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .mcp-card-actions button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .subtle-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

  /* --- Monitor tab: a dense dark "situation monitor" — deliberately its own
     visual world (always dark, monospace), independent of Edith's app-wide
     light/dark rounded-card theme used everywhere else. --- */
  #monitor-screen {
    --mon-bg: #0a0a0b; --mon-surface: #131316; --mon-surface-2: #1a1a1e; --mon-border: #26262b;
    --mon-text: #edeef0; --mon-muted: #6f6f78; --mon-header: #96969e;
    --mon-accent: #5ee1ff; --mon-danger: #ff5c5c;
    --mon-tag-0: #8ea9ff; --mon-tag-1: #ff9d6b; --mon-tag-2: #5ee1ff; --mon-tag-3: #c98bde; --mon-tag-4: #ffcf5c; --mon-tag-5: #7fd9a6;
    background: var(--mon-bg);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  #monitor-panel { color: var(--mon-text); max-width: 1400px; }
  .mon-section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--mon-header); font-weight: 700; margin: 0 0 10px; }
  .mon-row + .mon-row { margin-top: 22px; }
  .mon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
  .mon-stat-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .mon-tile { background: var(--mon-surface); border: 1px solid var(--mon-border); border-radius: 6px; padding: 12px 14px; flex: 1; min-width: 130px; }
  .mon-tile-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .mon-tile-value.is-empty { color: var(--mon-muted); font-size: 18px; }
  .mon-tile-label { font-size: 11px; color: var(--mon-header); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px; }
  .mon-tile-note { font-size: 11px; color: var(--mon-muted); margin-top: 4px; }
  .mon-tile-note.is-error { color: var(--mon-danger); }

  .mon-panel { background: var(--mon-surface); border: 1px solid var(--mon-border); border-radius: 6px; padding: 14px 16px; }

  .mon-list-row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--mon-border); font-size: 13px; }
  .mon-list-row:last-child { border-bottom: none; }
  .mon-list-row .mon-mono-id { font-size: 11px; color: var(--mon-muted); flex-shrink: 0; }
  .mon-list-row .mon-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mon-text); }
  .mon-list-row .mon-side { font-size: 11px; color: var(--mon-muted); flex-shrink: 0; white-space: nowrap; }

  .mon-item-card { padding: 10px 0; border-bottom: 1px solid var(--mon-border); }
  .mon-item-card:last-child { border-bottom: none; }
  .mon-item-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .mon-item-title { font-size: 13px; color: var(--mon-text); }
  .mon-item-meta { font-size: 11px; color: var(--mon-muted); white-space: nowrap; }
  .mon-item-note { font-size: 12px; color: var(--mon-muted); margin-top: 5px; white-space: pre-wrap; }
  .mon-item-actions { display: flex; gap: 10px; margin-top: 6px; }
  .mon-item-actions button { background: none; border: none; color: var(--mon-muted); font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; padding: 0; }
  .mon-item-actions button:hover { color: var(--mon-accent); }

  .mon-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .mon-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 3px; flex-shrink: 0; }
  .mon-badge.idea { color: var(--mon-accent); background: rgba(94, 225, 255, 0.12); }
  .mon-badge.bug { color: var(--mon-danger); background: rgba(255, 92, 92, 0.12); }

  .mon-news-item { padding: 9px 0; border-bottom: 1px solid var(--mon-border); font-size: 13px; line-height: 1.5; color: var(--mon-text); }
  .mon-news-item:last-child { border-bottom: none; }

  .mon-empty { color: var(--mon-muted); font-size: 12px; padding: 6px 0; }

  .mon-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--mon-surface-2); border: 1px solid var(--mon-border); border-radius: 4px; padding: 4px 6px 4px 10px; font-size: 11px; margin: 0 6px 6px 0; color: var(--mon-text); }
  .mon-chip button { background: none; border: none; color: var(--mon-muted); cursor: pointer; font-size: 13px; padding: 0 2px; font-family: inherit; }
  .mon-chip button:hover { color: var(--mon-danger); }

  .mon-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .mon-form input, .mon-form select {
    flex: 1; min-width: 120px; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--mon-border);
    background: var(--mon-surface-2); color: var(--mon-text); font-family: inherit; font-size: 12px;
  }
  .mon-form input::placeholder { color: var(--mon-muted); }
  .mon-form input:focus, .mon-form select:focus { outline: none; border-color: var(--mon-accent); }
  .mon-btn {
    background: none; border: 1px solid var(--mon-border); color: var(--mon-text); border-radius: 4px;
    padding: 8px 16px; font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    cursor: pointer; white-space: nowrap;
  }
  .mon-btn:hover { border-color: var(--mon-accent); color: var(--mon-accent); }
  .mon-btn:disabled { opacity: 0.5; cursor: default; }
  .mon-refresh { background: none; border: none; color: var(--mon-accent); font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; padding: 0; }

  /* --- Situation-monitor board: the dense edge-to-edge levelsio-style grid.
     A hairline separator look is achieved with a 1px grid gap over a border-
     colored board background, each cell painted the near-black page bg. --- */
  #monitor-panel { max-width: none; padding: 0; }
  .mon-topbar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--mon-border); flex-wrap: wrap; }
  .mon-brand { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: var(--mon-text); white-space: nowrap; }
  .mon-filters { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .mon-fgroup { display: inline-flex; border: 1px solid var(--mon-border); border-radius: 5px; overflow: hidden; }
  .mon-fbtn { background: none; border: none; color: var(--mon-muted); font-family: inherit; font-size: 11px; padding: 5px 10px; cursor: pointer; letter-spacing: 0.03em; }
  .mon-fgroup .mon-fbtn + .mon-fbtn { border-left: 1px solid var(--mon-border); }
  .mon-fbtn:hover { color: var(--mon-text); }
  .mon-fbtn.active { background: var(--mon-text); color: var(--mon-bg); font-weight: 700; }
  .mon-fbtn.toggle.active { background: var(--mon-accent); color: var(--mon-bg); }

  .mon-tabs { display: flex; align-items: stretch; overflow-x: auto; border-bottom: 1px solid var(--mon-border); scrollbar-width: none; }
  .mon-tabs::-webkit-scrollbar { display: none; }
  .mon-tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--mon-muted); font-family: inherit; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 9px 16px; cursor: pointer; white-space: nowrap; }
  .mon-tab:hover { color: var(--mon-text); }
  .mon-tab.active { color: var(--mon-text); }

  .mon-board { display: grid; grid-template-columns: 1.15fr 1.12fr 0.92fr; grid-template-areas: "globe ship ideas" "chart media stats"; gap: 1px; background: var(--mon-border); }
  .mon-cell { background: var(--mon-bg); padding: 12px 14px 14px; min-width: 0; display: flex; flex-direction: column; }
  .mon-cell.area-globe { grid-area: globe; }
  .mon-cell.area-ship  { grid-area: ship; }
  .mon-cell.area-ideas { grid-area: ideas; }
  .mon-cell.area-chart { grid-area: chart; }
  .mon-cell.area-media { grid-area: media; }
  .mon-cell.area-stats { grid-area: stats; }
  .mon-cell-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .mon-cell-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--mon-header); }
  .mon-scroll { overflow-y: auto; scrollbar-width: thin; }
  .area-ship .mon-scroll, .area-ideas .mon-scroll { max-height: 300px; }
  .area-media .mon-scroll { max-height: 300px; }

  .mon-live { display: inline-flex; align-items: center; gap: 5px; color: var(--mon-danger); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; }
  .mon-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mon-danger); animation: mon-pulse 1.4s ease-in-out infinite; }
  @keyframes mon-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  .mon-globe-wrap { position: relative; flex: 1; min-height: 300px; }
  .mon-globe-wrap canvas { width: 100%; height: 100%; display: block; }

  .mon-chart-wrap { flex: 1; min-height: 220px; display: flex; flex-direction: column; }
  .mon-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 8px; }
  .mon-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--mon-muted); }
  .mon-legend-swatch { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .mon-chart-wrap svg { width: 100%; flex: 1; min-height: 180px; }
  .mon-chart-bar:hover { opacity: 0.75; }

  /* Big revenue stat tiles (GROSS REVENUE / MRR / LAST PAYMENT / NET REVENUE) */
  .mon-bigstats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--mon-border); border: 1px solid var(--mon-border); border-radius: 6px; overflow: hidden; }
  .mon-bigstat { background: var(--mon-bg); padding: 12px 13px; min-height: 84px; }
  .mon-bigstat-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--mon-header); margin-bottom: 8px; }
  .mon-bigstat-value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; line-height: 1.1; word-break: break-all; }
  .mon-bigstat-value.is-empty { color: var(--mon-muted); font-size: 16px; }
  .mon-bigstat-note { font-size: 10.5px; color: var(--mon-muted); margin-top: 6px; }
  .mon-anon { filter: none; }
  .mon-redact { color: var(--mon-muted); letter-spacing: 0.05em; }

  /* Status / DOWN bar + scrolling sales ticker */
  .mon-statusbar { display: flex; align-items: center; gap: 8px; padding: 7px 14px; font-size: 11px; letter-spacing: 0.04em; border-top: 1px solid var(--mon-border); }
  .mon-statusbar.ok { background: rgba(127, 217, 166, 0.08); color: #7fd9a6; }
  .mon-statusbar.warn { background: rgba(255, 92, 92, 0.1); color: #ff8a8a; }
  .mon-ticker { overflow: hidden; white-space: nowrap; border-top: 1px solid var(--mon-border); background: #050506; padding: 7px 0; }
  .mon-ticker-track { display: inline-block; white-space: nowrap; will-change: transform; animation: mon-marquee 60s linear infinite; }
  .mon-ticker:hover .mon-ticker-track { animation-play-state: paused; }
  .mon-ticker-item { display: inline-flex; align-items: center; gap: 6px; padding: 0 22px; font-size: 12px; color: var(--mon-text); border-right: 1px solid var(--mon-border); }
  .mon-ticker-item .amt { font-weight: 700; }
  .mon-ticker-item .ago { color: var(--mon-muted); font-size: 11px; }
  @keyframes mon-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .mon-inline-form { margin-top: 8px; }
  .mon-inline-form summary { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--mon-muted); cursor: pointer; padding: 4px 0; list-style: none; }
  .mon-inline-form summary::-webkit-details-marker { display: none; }
  .mon-inline-form summary:hover { color: var(--mon-accent); }
  .mon-inline-form[open] summary { color: var(--mon-text); }

  @media (max-width: 1000px) {
    .mon-board { grid-template-columns: 1fr; grid-template-areas: "globe" "chart" "ship" "media" "ideas" "stats"; }
    .area-ship .mon-scroll, .area-ideas .mon-scroll, .area-media .mon-scroll { max-height: none; }
  }
</style>
</head>
<body>
  <div id="token-screen">
    <h2>Edith</h2>
    <input id="token-input" type="password" placeholder="Access token" autocomplete="off">
    <button id="connect-btn">Connect</button>
    <div id="token-error"></div>
  </div>

  <div id="app-shell">
    <div id="tab-bar">
      <span id="brand"><span id="brand-mark">E</span><span id="brand-word">Edith</span></span>
      <div id="tab-buttons">
        <button class="tab-btn" data-tab="overview"><span class="tab-icon">🏠</span><span class="tab-label">Overview</span></button>
        <button class="tab-btn" data-tab="chat"><span class="tab-icon">💬</span><span class="tab-label">Chat</span></button>
        <button class="tab-btn" data-tab="monitor"><span class="tab-icon">🖥️</span><span class="tab-label">Monitor</span></button>
        <button class="tab-btn" data-tab="observability"><span class="tab-icon">📊</span><span class="tab-label">Usage</span></button>
        <button class="tab-btn" data-tab="goals"><span class="tab-icon">🎯</span><span class="tab-label">Goals</span></button>
        <button class="tab-btn" data-tab="todos"><span class="tab-icon">✅</span><span class="tab-label">Todos</span></button>
        <button class="tab-btn" data-tab="insights"><span class="tab-icon">💡</span><span class="tab-label">Insights</span></button>
        <button class="tab-btn" data-tab="mcp"><span class="tab-icon">🔌</span><span class="tab-label">Integrations</span></button>
      </div>
      <button id="theme-toggle" title="Toggle theme">🌙</button>
    </div>

    <div id="overview-screen" class="screen"><div class="panel" id="overview-panel"></div></div>

    <div id="chat-screen" class="screen">
      <div id="status">connecting...</div>
      <div id="messages"></div>
      <div id="input-bar-wrap">
        <div id="command-menu"></div>
        <div id="input-bar">
          <button id="mic-btn" title="Tap to talk">🎤</button>
          <input id="text-input" type="text" placeholder="Message Edith... (try /)" autocomplete="off">
          <button id="send-btn">Send</button>
        </div>
      </div>
    </div>

    <div id="monitor-screen" class="screen"><div class="panel" id="monitor-panel"></div></div>
    <div id="observability-screen" class="screen"><div class="panel" id="observability-panel"></div></div>
    <div id="goals-screen" class="screen"><div class="panel" id="goals-panel"></div></div>
    <div id="todos-screen" class="screen"><div class="panel" id="todos-panel"></div></div>
    <div id="insights-screen" class="screen"><div class="panel" id="insights-panel"></div></div>
    <div id="mcp-screen" class="screen"><div class="panel" id="mcp-panel"></div></div>
  </div>

  <script src="theme.js"></script>
  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
